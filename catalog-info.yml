apiVersion: mcp/v1beta1
kind: MCPServer
metadata:
  name: patternfly-mcp
  title: PatternFly MCP Server
  description: >
    A production-ready Model Context Protocol (MCP) server that aggregates and
    serves the public PatternFly design system. It provides dynamic access to
    React component documentation, design patterns and tokens, accessibility
    guidelines, and JSON schemas. It utilizes an automated discovery mechanism
    to consume content from across the PatternFly ecosystem and Red Hat's public
    data sources.
  tags:
    - mcp
    - patternfly
    - design-system
    - react
    - design-tokens
    - accessibility
    - ux
    - documentation
    - open-api
    - data-aggregation
  annotations:
    backstage.io/source-location: url:https://github.com/patternfly/patternfly-mcp
    data.sources.discovery.docs.redhat.com/url: https://github.com/patternfly/patternfly-mcp/tree/main/docs
spec:
  type: remote
  lifecycle: ga
  owner: group:redhat/public-data-team
  primitives:
    - type: tool
      name: aggregated-data-query
      description: Search and retrieve PatternFly design guidelines, components, and technical documentation.
    - type: tool
      name: aggregated-data-access
      description: Access, transform, and consume structured PatternFly data, including component properties and usage examples.
    - type: resource
      name: processed-data-records
      description: Structured markdown records and JSON schemas for PatternFly design guidelines, accessibility, components and usage examples.
    - type: resource
      name: processed-data-collections
      description: Organized collections of PatternFly resources, categorized by content type.
  packages:
    - type: npm
      registry_name: registry.npmjs.org
      name: "@patternfly/patternfly-mcp"
  remotes:
    - type: streamable-http
      url: https://main.patternfly-org.pages.dev/api # Public static data endpoint
