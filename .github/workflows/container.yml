name: Container CI & GHCR

on:
  release:
    types: [ published ]
  pull_request:
    paths:
      - '.containerignore'
      - 'Containerfile'
      - 'scripts/container.*'
      - 'tests/container/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish image to registry on success'
        type: boolean
        default: false
      tag_override:
        description: 'Custom tag (default to "latest" or branch name)'
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build local test image
        uses: redhat-actions/buildah-build@v3
        with:
          image: localhost/patternfly-mcp
          tags: latest
          containerfiles: ./Containerfile

      - name: Audit MCP
        run: npm run container:test

  publish:
    name: Build & Publish Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ validate ]
    if: ${{ (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag_override || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Setup QEMU for multi-arch
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Build multi-arch image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          archs: amd64, arm64
          containerfiles: |
            ./Containerfile
      - name: Push image to registry
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ env.REGISTRY }}
