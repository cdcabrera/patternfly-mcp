name: Container CI & GHCR

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.containerignore'
      - 'Containerfile'
      - 'scripts/container.*'
      - 'tests/container/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish image to registry on success'
        type: boolean
        default: true
      tag_override:
        description: 'Custom tag (default to "test" or branch name)'
        type: string
        default: 'test'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    name: Build, Validate & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Log in to registry
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup OCI metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag_override || 'test' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
      - name: Setup architecture
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'linux/amd64,linux/arm64'
      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          archs: amd64, arm64
          containerfiles: |
            ./Containerfile
      - name: Audit MCP
        run: |
          # Test built image before pushing
          PFMCP_CONTAINER_IMAGE="${{ steps.build-image.outputs.image-with-tag }}" npm run container:test
      - name: Push image to registry
        if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          registry: ${{ env.REGISTRY }}
